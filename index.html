      /* tiny syntax highlighter */
      function Hl({ code }) {
        const parts = code.split(
          /(\/\/.*|"[^"]*"|'[^']*'|`[^`]*`|\b(?:const|let|function|return|if|import|from|export|async|await|new|true|false|default)\b|\b\d+\b|\b[a-zA-Z_]+(?=\())/g,
        );
        return parts.map((p, i) => {
          let c = "";
          if (/^\/\//.test(p)) c = "c";
          else if (/^["'`]/.test(p)) c = "s";
          else if (
            /^(const|let|function|return|if|import|from|export|async|await|new|default)$/.test(
              p,
            )
          )
            c = "k";
          else if (/^(true|false|\d+)$/.test(p)) c = "n";
          else if (/^[a-zA-Z_]+$/.test(p) && i % 2 === 1) c = "f";
          return c ? (
            <span key={i} className={c}>
              {p}
            </span>
          ) : (
            p
          );
        });
      }

          projects: Projects,
          "contact-me": Contact,
